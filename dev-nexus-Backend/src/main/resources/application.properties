spring.application.name=dev-nexus

server.port=8281

# DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/dev-nexus-db
spring.datasource.username=db_nexus_user
spring.datasource.password=${DB_NEXUS_PASSWORD}

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true

# Spring security configuration
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# Spring actuator configuration
management.endpoints.web.exposure.include=health,info

# .env file cofiguration
spring.config.import=optional:file:.env[.properties]