spring.application.name=dev-nexus

server.port=8281

spring.datasource.url=jdbc:postgresql://localhost:5432/dev-nexus-db
spring.datasource.username=db_nexus_user
spring.datasource.password=${DB_NEXUS_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true